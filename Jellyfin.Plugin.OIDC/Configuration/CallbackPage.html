<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authenticating...</title>
<style nonce="__CSP_NONCE__">
    :root { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #101010; color: #eee;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { box-sizing: border-box; background: #1c1c1c; padding: 2em; border-radius: 8px;
            max-width: 360px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,.5); text-align: center; }
    .spinner { width: 2.5em; height: 2.5em; margin: 0 auto 1.25em; border: .3em solid #444;
               border-top-color: #386d4b; border-radius: 50%; animation: spin .8s linear infinite; }
    h2 { margin: 0 0 .5em; }
    p { min-height: 1.4em; margin: 0; color: #aaa; line-height: 1.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: #444; } }
</style>
</head>
<body>
<main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h2>Completing authentication…</h2>
    <p id="status" role="status">Please wait…</p>
</main>
<script type="application/json" id="oidc-data">__DATA_JSON__</script>
<script nonce="__CSP_NONCE__">
(function() {
    const data = JSON.parse(document.getElementById('oidc-data').textContent);

    // The page is served at .../sso/OIDC/Callback/{id}; resolve the sibling Auth endpoint and
    // the Jellyfin app root relative to it, so the base path (Networking > Base URL) and the
    // reverse-proxy scheme/host come from the browser's own location, not a baked-in guess.
    const authUrl = new URL('../Auth/' + encodeURIComponent(data.providerId), window.location.href);
    const appRoot = new URL('../../../', window.location.href);

    const deviceId = localStorage.getItem(data.deviceIdKey) || crypto.randomUUID();
    localStorage.setItem(data.deviceIdKey, deviceId);

    fetch(authUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            Token: data.token,
            DeviceId: deviceId,
            DeviceName: navigator.userAgent.substring(0, 50),
            App: data.appName,
            AppVersion: data.appVersion
        })
    })
    .then(function(r) {
        if (!r.ok) throw new Error('Auth failed: ' + r.status);
        return r.json();
    })
    .then(function(auth) {
        var credentials = {
            Servers: [{
                Id: auth.ServerId,
                ManualAddress: appRoot.href.slice(0, -1),
                AccessToken: auth.AccessToken,
                UserId: auth.User.Id,
                DateLastAccessed: Date.now()
            }]
        };
        localStorage.setItem(data.credentialsKey, JSON.stringify(credentials));

        document.getElementById('status').textContent = 'Success! Redirecting...';
        window.location.href = appRoot.href;
    })
    .catch(function(err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
    });
})();
</script>
</body>
</html>
